    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      ✦ तमसो मा ज्योतिर्गमय ✦
    </textPath>
  </text>

  <!-- Bottom Inscription: ✦ DARKNESS UNTO LIGHT ✦ -->
