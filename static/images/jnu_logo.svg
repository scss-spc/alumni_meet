    <style>
      .navy-fill { fill: #0B1F4D; }
      .ring-accent { stroke: #0B1F4D; }
      .text-accent { fill: #FFFFFF; font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; }
      .sanskrit-text { font-size: 21.5px; font-weight: 700; letter-spacing: 0.12em; }
      .english-text { font-size: 19.5px; font-weight: 700; letter-spacing: 0.17em; }
      .estd-text { font-size: 11px; font-weight: 700; fill: #0B1F4D; font-family: 'Inter', system-ui, sans-serif; text-anchor: middle; letter-spacing: 0.22em; }
    </style>
  </defs>

  <!-- Outer Double Rings -->
  <circle cx="250" cy="250" r="244" fill="none" stroke="#0B1F4D" stroke-width="2.5" />
  <circle cx="250" cy="250" r="238" fill="none" stroke="#0B1F4D" stroke-width="1.2" />

  <!-- Main Navy Circular Ribbon Band -->
