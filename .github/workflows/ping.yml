name: Ping Server

on:
  schedule:
    # Runs every 14 minutes (0, 14, 28, 42, 56)
    - cron: '*/14 * * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the server
        # Replace the URL below with your actual server URL
        run: curl -sSf https://scss-alumni-meet.onrender.com/ > /dev/null
